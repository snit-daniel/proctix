# Run from the repo root: docker compose --env-file .env -f deploy/compose.yml ...
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &app-env
    PROCTIX_ENV: production
    PROCTIX_PUBLIC_URL: https://${PROCTIX_DOMAIN:?Set PROCTIX_DOMAIN}
    PROCTIX_DATABASE_URL: postgresql+psycopg://proctix_app:${PROCTIX_DB_PASSWORD:?Set a URL-safe runtime password}@db/proctix
    PROCTIX_DATA_DIR: /app/var/evidence
    PROCTIX_MODEL_DIR: /app/models
    PROCTIX_ENCRYPTION_KEY: ${PROCTIX_ENCRYPTION_KEY:?Set PROCTIX_ENCRYPTION_KEY}
    PROCTIX_AUTH_KEY: ${PROCTIX_AUTH_KEY:?Set PROCTIX_AUTH_KEY}
    PROCTIX_KEY_ID: ${PROCTIX_KEY_ID:-v1}
    PROCTIX_TURN_URL: ${PROCTIX_TURN_URL:-}
    PROCTIX_TURN_SECRET: ${PROCTIX_TURN_SECRET:-}
  volumes:
    - evidence:/app/var/evidence
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: proctix
      POSTGRES_USER: proctix_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PROCTIX_DB_PASSWORD: ${PROCTIX_DB_PASSWORD:?Set PROCTIX_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/01-runtime-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U proctix_migrator -d proctix]
      interval: 10s
      retries: 10
    networks: [internal]
    restart: unless-stopped
  migrate:
    <<: *app
    profiles: [operations]
    restart: 'no'
    command: [python, -m, proctix.cli, migrate]
    environment:
      <<: *app-env
      PROCTIX_DATABASE_URL: postgresql+psycopg://proctix_migrator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/proctix
  web:
    <<: *app
    expose: [8000]
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('localhost',8000),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, proctix.worker]
    healthcheck:
      disable: true
  proxy:
    image: caddy:2-alpine
    environment:
      PROCTIX_DOMAIN: ${PROCTIX_DOMAIN:?Set PROCTIX_DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.29.0.2
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres:
  evidence:
  caddy_data:
  caddy_config:
networks:
  internal:
    ipam:
      config:
        - subnet: 172.29.0.0/24
