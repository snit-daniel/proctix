[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proctix"
version = "0.2.0"
description = "Institution-isolated exam delivery, evidence capture, and human-reviewed proctoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.124,<1", "uvicorn[standard]>=0.32,<1", "SQLAlchemy>=2.0.43,<2.1",
  "psycopg[binary]>=3.2,<4", "cryptography>=50,<51", "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1", "pillow>=13.0.0,<14", "numpy>=2,<3",
  "opencv-python-headless>=4.12,<5", "qrcode[pil]>=8,<9", "pyotp>=2.9,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
[tool.setuptools.packages.find]
include = ["proctix*"]
[tool.setuptools.package-data]
proctix = ["static/*", "static/vendor/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
exclude = ["legacy", ".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
